<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HDD Factory Digital Twin</title>

  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #667078;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 280px;
      padding: 14px 16px;
      box-sizing: border-box;
      background: rgba(10, 20, 30, 0.9);
      color: white;
      border-left: 4px solid #00d9ff;
      border-radius: 6px;
      z-index: 20;
      display: none;
      pointer-events: none;
    }

    #info h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #info p {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
    }

    #help {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 9px 15px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 20;
      pointer-events: none;
    }
  </style>

  <script>
    /*
     * ============================================================
     * HDD FACTORY DIGITAL TWIN
     * ============================================================
     *
     * Production:
     *
     * M01 → Conveyor 1 → M02 → Conveyor 2 → M03
     *
     * Controls:
     *   Mouse      = Look around
     *   WASD       = Move
     *   Click      = Select machine
     *   VR button  = Enter WebXR when supported
     *
     * The scene uses lightweight A-Frame primitives only.
     */


    /* ------------------------------------------------------------
       Machine click component
       ------------------------------------------------------------ */

    AFRAME.registerComponent("machine-click", {

      schema: {
        title: {
          type: "string",
          default: "Machine"
        },

        description: {
          type: "string",
          default: ""
        }
      },

      init: function () {

        this.el.addEventListener("click", () => {

          const panel = document.getElementById("info");

          panel.innerHTML =
            "<h2>" + this.data.title + "</h2>" +
            "<p>" + this.data.description + "</p>";

          panel.style.display = "block";

          clearTimeout(this.timer);

          this.timer = setTimeout(() => {
            panel.style.display = "none";
          }, 5000);

        });

      }

    });


    /* ------------------------------------------------------------
       Simple WASD movement
       ------------------------------------------------------------ */

    AFRAME.registerComponent("simple-wasd", {

      schema: {
        speed: {
          type: "number",
          default: 3
        }
      },

      init: function () {

        this.keys = {};

        window.addEventListener("keydown", (event) => {
          this.keys[event.key.toLowerCase()] = true;
        });

        window.addEventListener("keyup", (event) => {
          this.keys[event.key.toLowerCase()] = false;
        });

      },

      tick: function (time, delta) {

        const dt = Math.min(delta, 50) / 1000;

        const movement = new THREE.Vector3();

        if (this.keys["w"]) {
          movement.z -= 1;
        }

        if (this.keys["s"]) {
          movement.z += 1;
        }

        if (this.keys["a"]) {
          movement.x -= 1;
        }

        if (this.keys["d"]) {
          movement.x += 1;
        }

        if (movement.lengthSq() > 0) {

          movement.normalize();

          movement.multiplyScalar(
            this.data.speed * dt
          );

          this.el.object3D.position.x += movement.x;
          this.el.object3D.position.z += movement.z;

        }

        /* Keep the player inside the factory. */

        this.el.object3D.position.x =
          Math.max(-13, Math.min(13, this.el.object3D.position.x));

        this.el.object3D.position.z =
          Math.max(-6, Math.min(6, this.el.object3D.position.z));

      }

    });


    /* ------------------------------------------------------------
       Conveyor carrier animation
       ------------------------------------------------------------ */

    AFRAME.registerComponent("carrier", {

      schema: {

        start: {
          type: "number"
        },

        end: {
          type: "number"
        },

        speed: {
          type: "number",
          default: 0.7
        }

      },

      init: function () {

        this.x = this.data.start;

      },

      tick: function (time, delta) {

        const dt = Math.min(delta, 50) / 1000;

        this.x += this.data.speed * dt;

        if (this.x > this.data.end) {
          this.x = this.data.start;
        }

        this.el.object3D.position.x = this.x;

      }

    });


    /* ------------------------------------------------------------
       Robot joint animation
       ------------------------------------------------------------ */

    AFRAME.registerComponent("robot-motion", {

      schema: {

        amplitude: {
          type: "number",
          default: 25
        },

        speed: {
          type: "number",
          default: 1
        }

      },

      init: function () {

        this.clock = Math.random() * 10;

      },

      tick: function (time, delta) {

        this.clock += delta / 1000;

        const wave =
          Math.sin(this.clock * this.data.speed);

        const wave2 =
          Math.sin(this.clock * this.data.speed + 1.2);

        const children = this.el.children;

        if (children.length >= 3) {

          const shoulder = children[0];
          const elbow = children[1];
          const wrist = children[2];

          shoulder.object3D.rotation.z =
            THREE.MathUtils.degToRad(
              wave * this.data.amplitude
            );

          elbow.object3D.rotation.z =
            THREE.MathUtils.degToRad(
              wave2 * this.data.amplitude * 0.7
            );

          wrist.object3D.rotation.z =
            THREE.MathUtils.degToRad(
              wave * this.data.amplitude * 0.35
            );

        }

      }

    });


    /* ------------------------------------------------------------
       Rotating spindle
       ------------------------------------------------------------ */

    AFRAME.registerComponent("spindle-spin", {

      tick: function (time, delta) {

        this.el.object3D.rotation.y +=
          delta * 0.003;

      }

    });


    /* ------------------------------------------------------------
       Floor grid
       ------------------------------------------------------------ */

    AFRAME.registerComponent("floor-grid", {

      init: function () {

        const root = this.el;

        const gridColor = "#50565b";

        /* Lines along X */

        for (let y = -7; y <= 7; y++) {

          const line = document.createElement("a-box");

          line.setAttribute(
            "position",
            `0 0.006 ${y}`
          );

          line.setAttribute("width", "30");
          line.setAttribute("height", "0.012");
          line.setAttribute("depth", "0.012");

          line.setAttribute(
            "material",
            `color:${gridColor}`
          );

          root.appendChild(line);

        }

        /* Lines along Z */

        for (let x = -15; x <= 15; x++) {

          const line = document.createElement("a-box");

          line.setAttribute(
            "position",
            `${x} 0.007 0`
          );

          line.setAttribute("width", "0.012");
          line.setAttribute("height", "0.012");
          line.setAttribute("depth", "14");

          line.setAttribute(
            "material",
            `color:${gridColor}`
          );

          root.appendChild(line);

        }

      }

    });

  </script>
</head>

  <!-- User instructions -->
